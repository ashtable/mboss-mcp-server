name: CI
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The nested sources are imported at typecheck and test time through path aliases.
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # The suite regenerates tools.manifest.json from the registry and fails
      # on any difference, so a drifted manifest fails CI here.
      - run: npm test
